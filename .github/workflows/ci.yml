name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Lint currently fails on pre-existing violations unrelated to any
      # one change (React Compiler purity rules the codebase predates) --
      # tracked as a known issue, not blocking CI on it yet so this
      # doesn't just get bypassed with --no-verify on every PR.
      - run: npm run lint
        continue-on-error: true

      - run: npm run test

      - run: npm run build

  backend:
    name: Backend (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest tests/ -v

  ml:
    name: ML (shot-quality model test + evaluation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m pytest tests/ -v

      # Regenerates results/metrics.json + confusion_matrix.png on every
      # push, so the numbers in the deck can always be reproduced from a
      # clean checkout instead of trusted on faith.
      - run: python train_shot_quality_model.py

      - uses: actions/upload-artifact@v4
        with:
          name: shot-quality-model-results
          path: ml/results/
